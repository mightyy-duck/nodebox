name: Release build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac dmg zip --arm64
          - os: windows-latest
            args: --win zip msi --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm install --no-save electron@45.4.1 electron-builder@26.18.0
      - run: npm test
      - run: npx electron-builder --config electron-builder.ci.json --publish never ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: NodeBox-${{ matrix.os }}
          path: |
            dist-ci/NodeBox-*.dmg
            dist-ci/NodeBox-*.zip
            dist-ci/NodeBox-*.msi
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - name: Checksums
        run: cd files && sha256sum NodeBox-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v2
        if: ${{ !github.event.repository.private }}   # GitHub offers this only for public repositories
        with:
          subject-path: files/NodeBox-*
      - uses: actions/upload-artifact@v4
        with: { name: NodeBox-all, path: files/* }
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          V="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" --title "NodeBox $V" --notes "Mac (Apple silicon): .dmg. Windows: portable .zip (no installer, no administrator rights) or .msi. The files are not code-signed yet, so macOS Gatekeeper or Windows SmartScreen may warn."
